# 20_a4_subset_nocond: ONE change vs 19_a4_subset: age/sex condition zeroed (data.condition_scale 0), to test whether
# the subset network memorizes subjects through the condition input (diagnostic only; the atlas needs the condition).
seed: 42
device: cuda
output_root: /medias/medical/caravel/zhangx/training_outputs/sdf_only/runs
run_name: 20_a4_subset_nocond
resume: null
require_fresh_start: true
data:
  tsv: /medias/medical/data/Atlas_training/v1/ixi_metadata_label_t1_fast_sdf.tsv
  subject_ids: /medias/medical/data/Atlas_training/v1/subject_ids_label_t1_fast.yaml
  split_key: mra_atlas_synthseg_label_t1_fast.subject_ids
  split: train
  expected_split_counts: {train: 497, val: 55, test: 0}
  require_complete_split: true
  max_subjects: null
  subset_include: [IXI269-Guys-0839, IXI396-HH-2115, IXI521-HH-2353, IXI093-HH-1359, IXI588-IOP-1158, IXI465-HH-2176] # the 6 full-scale 0c diagnostic subjects
  world_bbox_mm: [240, 240, 120]
  age_range: [19, 87]
  sex_categories: [M, F]
  condition_scale: 0.0
  cache_subjects: 1
  num_workers: 2
sampling:
  sdf:
    points: 250000
    surface_band_mm: 2.0
    fractions: {surface: 0.5, interior: 0.25, outside: 0.25}
sdf:
  truncation_mm: 5.0
  sign_convention: negative_inside
  distance_units: mm
model:
  latent_shape: [256, 3, 3, 3]
  latent_std: 0.01
  hidden_size: 1024
  hidden_layers: 5
  modulated_layers: [1, 3, 5]
  omega_first: 30.0
  omega_hidden: 30.0
  convolution_kernel: 3
  use_moe: true
  num_experts: 4
  moe_k: 2
  rigid: true
  transform: # subject -> template map (vatl_sdf/model.py)
    mode: normalized # rotation rad, translation in bbox half-lengths (legacy: translation in mm)
    type: affine # + log-scale and shear (own lr), regularized
    mean_identity: true # population mean transform fixed at identity (removes the global gauge)
    centroid_init: false
    affine_reg_weight: 0.1 # on mean squared log-scale + shear
loss:
  # Legacy 02_sdf_only used 0.1. Adam makes the global loss scale minor, but the
  # SDF : MoE-balance ratio changes from 10:1 to 100:1.
  sdf_weight: 1.0
  moe_weight: 0.01
  tf_weight: 0.0
  sdf_metric: l1
graph:
  # Graph terms apply only where the reference mask supports them (Phase 0a decision):
  # a node is supported within support_tolerance_mm of the voxelized mask (half a 0.8 mm
  # graph voxel); supported nodes outside the mask are snapped to their nearest mask voxel
  # centre for hinge targets. support_strict: true = nearest-voxel rule, no snapping.
  support_tolerance_mm: 0.4
  support_strict: false
  edge_step_mm: 0.4 # spacing of the samples used to accept/reject an edge
  # Each enabled point term draws points_fraction * sampling.sdf.points EXTRA points per
  # subject per epoch, so combining terms adds compute and never dilutes another term.
  centerline_sdf: # default centreline term: reference SDF at points along graph edges
    enabled: true
    weight: 0.15 # = points_fraction: per-point weight equal to SDF samples
    points_fraction: 0.15
  centerline_hinge: # max(0, SDF_pred - ceiling) at supported (snapped) nodes
    enabled: false
    weight: 1.0
    points_fraction: 0.15
    epsilon_mm: 0.0
  edge_hinge: # same hinge along mask-supported edges; never connects separate graph pieces
    enabled: false
    weight: 1.0
    points_fraction: 0.15
    epsilon_mm: 0.0
  radius: # optional: |SDF_pred + r| at supported nodes with r >= min_radius_mm (never floor nodes)
    enabled: false
    weight: 1.0
    points_fraction: 0.15
    min_radius_mm: 0.9
  eikonal: # optional: (|grad SDF|_mm - 1)^2 on SDF samples with |reference| <= band_mm
    enabled: false
    weight: 0.1
    band_mm: 2.0
graph_fields:
  # Phase 4 implicit graph fields: extra heads on the shared backbone, evaluated at the SDF samples.
  # Targets come from the mask-supported graph only (vatl_sdf/graph_fields.py); local radius is
  # -reference SDF at the nearest centreline point. Weight 0 near short loops / unsupported nodes.
  centerline_distance: {enabled: true, weight: 1.0}
  radius: {enabled: false, weight: 1.0}
  tangent: {enabled: false, weight: 0.1}
  junction: {enabled: false, weight: 1.0}
  band_mm: 1.0 # radius/tangent supervised where distance <= radius + band_mm
  junction_sigma_mm: 1.0
  short_loop_mm: 5.0
  exclusion_mm: 1.0
alignment: # staged training (vatl_sdf/train.py): stage 1 latents gated to zero, all subjects decode one template
  enabled: true
  epochs: 10 # kept from the pilot (user decision 2026-10-31): 16,600 of 59,760 steps at full scale
  sdf_truncation_mm: 20.0 # stage-1 SDF target clamp (head units stay sdf.truncation_mm)
  sdf_weight: 1.0
  large_vessel_weight: 1.0 # L1 of distance to the large-vessel centreline (stage-1 head align_distance)
  large_vessel_min_radius_mm: 1.2 # local radius = -reference SDF at the centreline
  latent_prior_weight: 0.001 # stage 2: weight on mean squared latent norm (~5 at convergence -> ~0.005)
optimizer:
  lr_model: 0.0001
  lr_latent: 0.0005
  lr_transform: 0.0001 # legacy transforms only
  lr_rotation: 0.0001
  lr_translation: 0.0001 # per step ~0.012 mm (x, y) / 0.006 mm (z) in normalized units
  lr_scale: 0.0001
  weight_decay: 0.0
  scheduler_epochs: run # cosine horizon = epochs this run trains (user decision 2026-10-31)
  eta_min: 0.000025
training:
  epochs: 20
  subjects_per_rank: 5 # four GPUs -> 20 subjects per distributed batch
  # SDF points per rank per optimizer step. Unchanged from the legacy runs, which also
  # sent 25000 MRA points per step; that half of the compute is now freed.
  task_points_per_step: 25000
  checkpoint_every: 10
  atlas_every: 10
  max_steps: null # global optimizer-step limit; smoke tests only
  stop_after_epoch: 19 # inclusive: 20 epochs (10 alignment + 10 refinement); horizon = run
atlas:
  age: 20.0
  sex: M
  spacing_mm: [1, 1, 1]
  gaussian_span_years: 5.0
  max_subjects: 100
  chunk_size: 20000
